<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emotion Detection</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f0f2f5;
        color: #1c1e21;
        min-height: 100vh;
      }
      header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        padding: 40px 20px;
        text-align: center;
      }
      header h1 {
        margin: 0;
        font-size: 2.2rem;
      }
      header p {
        margin: 8px 0 0;
        opacity: 0.9;
      }
      .container {
        max-width: 720px;
        margin: -30px auto 40px;
        padding: 0 20px;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 28px;
      }
      textarea {
        width: 100%;
        min-height: 130px;
        padding: 14px;
        font-size: 1rem;
        border: 1px solid #d0d3d9;
        border-radius: 10px;
        resize: vertical;
        font-family: inherit;
      }
      textarea:focus {
        outline: none;
        border-color: #764ba2;
        box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 14px;
        font-size: 1.05rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.2s ease;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .message {
        margin-top: 20px;
        font-weight: 600;
        text-align: center;
        min-height: 1.2em;
      }
      .message.success {
        color: #2e7d32;
      }
      .message.error {
        color: #c62828;
      }
      #results {
        margin-top: 18px;
      }
      .bar-row {
        margin-bottom: 16px;
      }
      .bar-row.dominant .bar-label span:first-child {
        font-weight: 700;
      }
      .bar-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 0.95rem;
      }
      .bar-track {
        background: #eceef1;
        border-radius: 8px;
        height: 18px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 8px;
        width: 0;
        transition: width 0.6s ease;
      }
      footer {
        text-align: center;
        color: #8a8d91;
        font-size: 0.85rem;
        padding: 0 20px 30px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Emotion Detection</h1>
      <p>Offline, lexicon-based analysis of anger, disgust, fear, joy &amp; sadness</p>
    </header>

    <div class="container">
      <div class="card">
        <textarea
          id="textInput"
          placeholder="Type or paste some text here, then click Analyze..."
        ></textarea>
        <button id="analyzeBtn">Analyze</button>
        <div id="message" class="message"></div>
        <div id="results"></div>
      </div>
    </div>

    <footer>
      Runs fully offline &mdash; no external AI service required.
    </footer>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
  </body>
</html>
