version: "3.9"

# Optional: spin up SQL Server + each microservice for local dev.
# Build images with `dotnet publish` first, or extend with Dockerfiles.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Sup3rS3cret!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  sqldata:
