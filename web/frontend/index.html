<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A0B1F" />
  <title>Secret Admirer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="brand">
      <span class="brand-mark">SA</span>
      <span>Secret Admirer</span>
    </div>

    <div class="hero">
      <h1>From your secret admirer.</h1>
      <p>Share a link. Receive anonymous notes from the people who notice you.</p>
    </div>

    <div class="card">
      <div class="tabs" role="tablist">
        <div class="tab active" data-tab="login" role="tab">Sign in</div>
        <div class="tab" data-tab="register" role="tab">Create account</div>
      </div>

      <form id="login-form" class="tab-panel">
        <div class="form-group">
          <label for="login-identifier">Handle or email</label>
          <input type="text" id="login-identifier" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <button class="btn" type="submit">Sign in</button>
        <div class="error" id="login-error" hidden></div>
      </form>

      <form id="register-form" class="tab-panel" hidden>
        <div class="form-group">
          <label for="reg-handle">Handle</label>
          <input type="text" id="reg-handle" pattern="[a-z0-9_]{3,30}" autocomplete="username" required />
          <small class="muted">Lowercase letters, numbers, underscores. 3–30 chars.</small>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" minlength="8" autocomplete="new-password" required />
        </div>
        <button class="btn" type="submit">Create account</button>
        <div class="error" id="register-error" hidden></div>
      </form>
    </div>

    <p class="muted center" style="margin-top: 16px;">
      No fake notifications. Real login. Editable profile.
    </p>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
