<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A0B1F" />
  <title>Inbox — Secret Admirer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="brand">
      <span class="brand-mark">SA</span>
      <span>Secret Admirer</span>
    </div>

    <div class="share-card" id="share-card">
      <h3>Your link</h3>
      <a class="share-link" id="share-link" href="#" target="_blank">loading…</a>
      <div class="row">
        <button class="btn btn-ghost" id="copy-link">Copy</button>
        <button class="btn" id="share-link-btn">Share</button>
      </div>
    </div>

    <h2 style="margin-top: 24px;">Notes <span class="muted" id="inbox-count" style="font-size:1rem"></span></h2>
    <div id="inbox-list"><div class="empty-state">loading…</div></div>
  </div>

  <nav class="footer">
    <a href="inbox.html" class="active">Inbox</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="logout">Sign out</a>
  </nav>

  <div id="message-modal" hidden style="position:fixed;inset:0;background:rgba(10,4,16,0.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;">
    <div class="card" style="max-width:420px;width:100%;">
      <h3 id="modal-title">A secret note</h3>
      <p id="modal-body" style="margin: 12px 0 16px; white-space: pre-wrap;"></p>
      <p class="muted" id="modal-time" style="font-size: 0.85rem; margin-bottom: 16px;"></p>
      <div class="row">
        <button class="btn btn-ghost" id="modal-close">Close</button>
        <button class="btn btn-danger" id="modal-delete">Delete</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/inbox.js"></script>
</body>
</html>
